[project]
name = "prerequisites"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "api",
    "dotenv>=0.9.9",
    "google-genai>=2.10.0",
    "anthropic>=2.10.0",
    "openai>=2.43.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "streamlit>=1.58.0",
]

[tool.uv.sources]
api = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/chatbot_ui",
]

[dependency-groups]
dev = [
    "duckdb>=2.0.1",
    "ipykernel>=7.3.0",
    "langsmith>=0.16.2",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbstripout>=0.9.2",
    "qdrant-client>=1.20.0",
]
